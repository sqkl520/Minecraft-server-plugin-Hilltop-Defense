name: build

# R-6: CI toolchain smoke check.
#
# Scope is deliberately narrow: this workflow ONLY builds and tests. It performs
# no distribution step of any kind; the author decides when a version ships.
#
# The local wrapper tools/build.sh defaults to a Windows Maven path
# (D:/maven/apache-maven-3.9.9/bin/mvn.cmd) and a Windows JDK glob, so on a
# Linux runner both must be overridden explicitly:
#   HV_MAVEN=mvn                    -> use the Maven on PATH (actions/setup-java)
#   HV_JDK21_HOME="$JAVA_HOME"      -> reuse the JDK that setup-java provisioned
#
# Do NOT add -o (offline) here: ~/.m2 on CI starts empty.
#
# build.sh is invoked via `bash tools/build.sh`, NOT `./tools/build.sh`: this
# repository has core.fileMode=false, so the git-tracked mode is always 100644
# and the file is not executable after checkout on a Linux runner. Calling it
# through bash keeps the workflow independent of that bit.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build-and-test (Linux, JDK 21)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build and test
        shell: bash
        run: |
          # Linux runner: use the Maven and JDK that setup-java put on PATH.
          export HV_MAVEN=mvn
          export HV_JDK21_HOME="$JAVA_HOME"
          # via `bash`, not `./`: the executable bit is not preserved (core.fileMode=false).
          bash tools/build.sh -B clean test

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

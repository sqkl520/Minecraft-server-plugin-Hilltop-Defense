name: build

# R-6: CI toolchain smoke check.
#
# Scope is deliberately narrow: this workflow ONLY builds and tests. It performs
# no distribution step of any kind; the author decides when a version ships.
#
# The local wrapper build.sh defaults to a Windows Maven path
# (D:/maven/apache-maven-3.9.9/bin/mvn.cmd) and a Windows JDK glob, so on a
# Linux runner both must be overridden explicitly:
#   HV_MAVEN=mvn                    -> use the Maven on PATH (actions/setup-java)
#   HV_JDK21_HOME="$JAVA_HOME"      -> reuse the JDK that setup-java provisioned
#
# Do NOT add -o (offline) here: ~/.m2 on CI starts empty.
#
# build.sh is invoked via `bash build.sh`, NOT `./build.sh`: this repository has
# core.fileMode=false, so the git-tracked mode is always 100644 and the file is
# not executable after checkout on a Linux runner. Calling it through bash keeps
# the workflow independent of that bit.
# (Path note: the script lives at the repo root on main. A stacked branch may move
#  it to tools/; the merge that lands that move also updates line ~67.)
#
# Trigger scope: every pull request, regardless of its base branch. Restricting
# `pull_request` to `main` meant stacked PRs (base = another feature branch) ran
# no CI at all — their "tests pass" claim rested entirely on the author's local
# run, which is exactly the kind of unverified assertion a green badge is
# supposed to rule out. `push` stays limited to `main` so feature branches do not
# build twice (once on push, once on the PR).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build-and-test (Linux, JDK 21)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build and test
        shell: bash
        run: |
          # Linux runner: use the Maven and JDK that setup-java put on PATH.
          export HV_MAVEN=mvn
          export HV_JDK21_HOME="$JAVA_HOME"
          # via `bash`, not `./`: the executable bit is not preserved (core.fileMode=false).
          bash build.sh -B clean test

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  setup.step1: "&6[&e{0}/{1}&6] &f确认游戏世界: &b{world} &f— 是否正确？&7（继续将重新设置核心坐标；原值在第 2 步确认前保留。）"
  setup.step2: "&6[&e{0}/{1}&6] &f站在村庄核心位置，点击确认"
  setup.step3: "&6[&e{0}/{1}&6] &f本步要部署两套独立坐标：&a① 玩家出生点&f —— 开局时玩家被传送到的位置（阵亡复活用第 2 步的核心，不是这里）；&c② 怪物刷怪点&f —— 怪物出生的位置。两套各需 &e≥1 个&f。"
  setup.step3-mobspawns: "&6[&e{0}/{1}&6] &f做法：走到出生点位置点击 &e[添加当前位置]&f；走到刷怪点位置点击 &e[添加刷怪点]&f。两套点都配好后点 &b[打开生成点总览]&f —— 总览里显示两套点的计数与状态、可进入两个子管理界面查看/删除，并在此点击唯一的 &a[完成]&f 进入下一步；想中途退出点击 &7[保存并返回大厅]&f，进度不会丢。"
  setup.step4-nodes: "&6[&e{0}/{1}&6] &f能量节点 = 重生锚方块。先在地图上放置重生锚，然后站在节点方块旁边点击 &a[添加节点]&f（或打开管理GUI）——节点必须&e手动注册&f，没有自动识别。&e至少注册 1 个：&f0 节点的场里，任意一名玩家阵亡都会立即导致全队判负，且所有人无法复活（复活需要修复活跃节点）。"

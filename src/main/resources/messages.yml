# ============================================================
#  Hilltop Village — 语言文件 (messages.yml)
# ============================================================
#  支持语言: en (English), zh (中文)
#  颜色代码使用 & 符号: &a=绿 &c=红 &e=黄 &6=金 &7=灰 &b=青 &r=重置
#  占位符: {0}, {1}, {2} ...
#  修改后使用 /hilltop lang <en|zh> 或重启服务器即可生效。
#
#  === 消息结构说明 ===
#  每个语言区块 (en/zh) 下的消息键必须一一对应。
#  新增语言键时请在 en 和 zh 区块中同步添加。
# ============================================================


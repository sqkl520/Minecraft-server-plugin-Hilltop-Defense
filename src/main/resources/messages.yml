  # === 部署向导 ===
  setup.step1: "&6[&e{0}/{1}&6] &fConfirm game world: &b{world} &f— Is this correct? &7(Continuing will re-set the core location; the current value is kept until you confirm it in Step 2.)"
  setup.step2: "&6[&e{0}/{1}&6] &fStand on the village core and click confirm"
  setup.step3: "&6[&e{0}/{1}&6] &fThis step deploys two independent sets of coordinates: &a① player spawns&f — where players are teleported when a game starts (respawns use the core from Step 2); &c② mob spawn points&f — where monsters spawn. At least &e1 of each&f is required."
  setup.step3-mobspawns: "&6[&e{0}/{1}&6] &fHow: stand at a spawn spot and click &e[Add Current Location]&f; stand at a mob spot and click &e[Add Mob Spawn]&f. With both sets ready, click &b[Open Spawn Points Overview]&f — the hub shows the count/status of both sets, lets you open the two sub-manager GUIs to review/delete, and carries the single &a[Done]&f button that advances to the next step; to leave early click &7[Save & Back to Lobby]&f — progress is kept."
  setup.step4-nodes: "&6[&e{0}/{1}&6] &fEnergy nodes = respawn anchor blocks. Place respawn anchors in the map first, then stand next to a node block and click &a[Add Node]&f (or use the manager GUI) — nodes are registered &emanually&f, there is no auto-detect. &eAt least 1 node is required:&f with 0 nodes, the first player death fails the whole team instantly and nobody can be revived (revival needs an active node to repair)."
  setup.nodes-required: "&cYou need at least 1 registered energy node before continuing — with 0 nodes, the first player death fails the whole team instantly and revival is impossible (there is nothing to repair). Stand next to a respawn anchor and click &e[Add Node]&c."

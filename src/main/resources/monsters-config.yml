# ============================================================
#  村民守卫战PLUS — 怪物配置文件 (monsters-config.yml)
# ============================================================
#  此文件定义所有可用怪物类型的完整属性。
#  使用 /hilltop config 在游戏内通过 GUI 界面编辑（怪物设置页）。
#  使用 /hilltop reloadconfig 重新加载此文件到内存。
#
#  === 字段说明 ===
#  entity-type:         Minecraft 实体类型 (如 ZOMBIE, SKELETON, CAVE_SPIDER)
#  display-name:        怪物头顶显示名称（支持颜色代码 &）
#  display-egg:         GUI 中显示的刷怪蛋图标 Material
#  health:              最大生命值
#  speed:               移动速度倍率 (0.1~2.0)
#  base-damage:         基础攻击伤害值
#  itemsadder-id:       ItemsAdder 模型命名空间ID (如 "myplugin:boss", 留空不使用)
#  custom-model-data:   原版自定义模型数据 (配合资源包, 0=不使用)
#  main-hand:           主手武器/工具 Material (如 IRON_SWORD, 留空=none)
#  off-hand:            副手物品 Material (如 SHIELD, 留空=none)
#  helmet               头盔 Material (留空=none)
#  chestplate:          胸甲 Material (留空=none)
#  leggings:            护腿 Material (留空=none)
#  boots:               靴子 Material (留空=none)
#  explode-damage-multiplier:  自爆对节点伤害倍率 (仅自爆甲虫有效)
#  hook-velocity:             钩爪投射速度 (仅钩爪猎手有效)
#  cooldown-ticks:            技能冷却 tick 数 (仅钩爪猎手/飞行抛投者有效)
#  stun-duration-ticks:       眩晕持续 tick 数 (仅钩爪猎手有效)
#  airdrop-mob-count:         每次空投怪物数量 (仅飞行抛投者有效)
# ============================================================

# ============================================================
#  自爆甲虫：高速移动至能量节点附近后自爆
# ============================================================
explode-beetle:
  entity-type: CAVE_SPIDER
  display-name: "&c自爆甲虫"
  display-egg: CAVE_SPIDER_SPAWN_EGG
  health: 40.0
  speed: 0.3
  base-damage: 4.0
  itemsadder-id: ""
  custom-model-data: 0
  main-hand: ""
  off-hand: ""
  helmet: ""
  chestplate: ""
  leggings: ""
  boots: ""
  explode-damage-multiplier: 3.0
  hook-velocity: 1.0
  cooldown-ticks: 0
  stun-duration-ticks: 0
  airdrop-mob-count: 0

# ============================================================
#  钩爪猎手：远程射击将玩家拖拽到身边并造成眩晕

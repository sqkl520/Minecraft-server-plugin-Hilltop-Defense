  health: 60.0
  speed: 0.25
  base-damage: 6.0
  itemsadder-id: ""
  custom-model-data: 0
  main-hand: BOW
  off-hand: ""
  helmet: ""
  chestplate: ""
  leggings: ""
  boots: ""
  explode-damage-multiplier: 0
  hook-velocity: 1.8
  cooldown-ticks: 60
  stun-duration-ticks: 40

# ============================================================
#  村民守卫战PLUS — 怪物配置文件 (monsters-config.yml)
# ============================================================
#  此文件定义所有可用怪物类型的完整属性。
#  使用 /hilltop config 在游戏内通过 GUI 界面编辑（怪物设置页）。
#  使用 /hilltop reloadconfig 重新加载此文件到内存。
#
#  === 本文件中【生效】的字段 ===
#  entity-type:         Minecraft 实体类型 (如 ZOMBIE, SKELETON, CAVE_SPIDER)，实际生成的怪物种类
#  base-damage:         基础攻击伤害值（对玩家与能量节点同数值）
#  itemsadder-id:       ItemsAdder 模型命名空间ID (如 "myplugin:boss", 留空不使用)
#  custom-model-data:   原版自定义模型数据 (配合资源包, 0=不使用)
#  main-hand:           主手武器/工具 Material (如 IRON_SWORD, 留空=none)
#  off-hand:            副手物品 Material (如 SHIELD, 留空=none)
#  helmet:              头盔 Material (留空=none)
#  chestplate:          胸甲 Material (留空=none)
#  leggings:            护腿 Material (留空=none)
#  boots:               靴子 Material (留空=none)
#
#  === 本文件中【不生效】的字段 ===
#  以下字段请改 game-settings.yml 的 monsters 段（本文件中的同名值会被忽略）：
#  health, speed, display-egg, display-name, hook-velocity,
#  cooldown-ticks, stun-duration-ticks, airdrop-mob-count, explode-damage-multiplier,
#  entity-explosion (explode-beetle)
# ============================================================

# ============================================================
#  自爆甲虫：高速移动至能量节点附近后自爆
# ============================================================
explode-beetle:
  entity-type: CAVE_SPIDER
  display-name: ""
  display-egg: CAVE_SPIDER_SPAWN_EGG
  health: 40.0
  speed: 0.3
  base-damage: 4.0
  itemsadder-id: ""
  custom-model-data: 0
  main-hand: ""
  off-hand: ""
  helmet: ""
  chestplate: ""
  leggings: ""
  boots: ""
  explode-damage-multiplier: 3.0
  entity-explosion: true
  hook-velocity: 1.0
  cooldown-ticks: 0
  stun-duration-ticks: 0
  airdrop-mob-count: 0

# ============================================================
#  钩爪猎手：远程射击将玩家拖拽到身边并造成眩晕
# ============================================================
hook-claw-hunter:
  entity-type: SKELETON
  display-name: ""
  display-egg: SKELETON_SPAWN_EGG
  health: 60.0
  speed: 0.25
  base-damage: 6.0
  itemsadder-id: ""
  custom-model-data: 0
  main-hand: BOW
  off-hand: ""
  helmet: ""
  chestplate: ""
  leggings: ""
  boots: ""
  explode-damage-multiplier: 0
  hook-velocity: 1.8
  cooldown-ticks: 60
  stun-duration-ticks: 40
  airdrop-mob-count: 8

# ============================================================
#  飞行抛投者：飞行中向地面空投小怪群
# ============================================================
flying-dropper:
  entity-type: PHANTOM
  display-name: ""
  display-egg: PHANTOM_SPAWN_EGG
  health: 80.0
  speed: 0.3
  base-damage: 8.0
  itemsadder-id: ""
  custom-model-data: 0
  main-hand: ""
  off-hand: ""
  helmet: ""
  chestplate: ""
  leggings: ""
  boots: ""
  explode-damage-multiplier: 0
  hook-velocity: 0
  cooldown-ticks: 160
  stun-duration-ticks: 3
  airdrop-mob-count: 10
